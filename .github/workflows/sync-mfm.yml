name: Sync MFM catalog

on:
  schedule:
    # Every 4 hours (minute 17: GitHub delays jobs queued on the hour), so a
    # new Munitorum Field Manual shows up the same day. Only real changes are
    # written, so most runs are a no-op.
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: lets the last step trigger the points email at once.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape MFM and update Supabase
        run: node scripts/mfm/sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Points changed? Email everyone right away (api/email.ts dedupes, so
      # calling it when nothing changed is harmless). Needs the CRON_SECRET
      # repository secret (same value as in Vercel); without it the daily
      # Vercel cron sends the email at 09:00 UTC instead.
      - name: Announce points changes by email
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "https://administratum.site/api/email?action=points"
