name: Sync MFM catalog

on:
  schedule:
    # Every 4 hours (minute 17: GitHub delays jobs queued on the hour), so a
    # new Munitorum Field Manual shows up the same day. Only real changes are
    # written, so most runs are a no-op.
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape MFM and update Supabase
        run: node scripts/mfm/sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
